name: Bytebench Android APK

on:
  push:
    paths:
      - "bytebench-app/**"
      - ".github/workflows/bytebench-android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bytebench-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bytebench-app
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/Bytebench-${VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Bytebench-${{ env.VERSION_NAME }}
          path: bytebench-app/out/*.apk
          retention-days: 7

      # The APK is kept private: remove the public release this workflow used to publish.
      - name: Remove the old public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete bytebench-app-latest --yes --cleanup-tag 2>/dev/null || echo "No public release to remove."
